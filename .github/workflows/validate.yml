name: Validate and package Space View

on:
  pull_request:
  push:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
      - name: Home Assistant hassfest
        uses: home-assistant/actions/hassfest@cd6f3635a740c84d8a14f6121a90068b8ece6bf6 # master

  prepare-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Home Assistant hassfest
        uses: home-assistant/actions/hassfest@cd6f3635a740c84d8a14f6121a90068b8ece6bf6 # master
      - name: Build deterministic flat HACS package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile, ZipInfo

          component = Path("custom_components/neonplan3d")
          manifest_path = component / "manifest.json"
          if not manifest_path.is_file() or not Path("LICENSE").is_file():
              raise SystemExit("The integration manifest and root LICENSE are required.")

          version = json.loads(manifest_path.read_text(encoding="utf-8"))["version"]
          if os.environ["RELEASE_TAG"] != f"v{version}":
              raise SystemExit("The release tag must be v<manifest version>.")

          files = sorted(path for path in component.rglob("*") if path.is_file())
          if not files:
              raise SystemExit("The integration directory is empty.")

          def add_file(archive, source, name):
              info = ZipInfo(name, date_time=(2020, 1, 1, 0, 0, 0))
              info.compress_type = ZIP_DEFLATED
              info.external_attr = 0o100644 << 16
              archive.writestr(info, source.read_bytes(), compress_type=ZIP_DEFLATED, compresslevel=9)

          with ZipFile("spaceview.zip", "w", compression=ZIP_DEFLATED, compresslevel=9) as archive:
              for path in files:
                  add_file(archive, path, path.relative_to(component).as_posix())
              add_file(archive, Path("LICENSE"), "LICENSE")
          PY
      - name: Attach package to GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: spaceview.zip
          overwrite_files: true
          token: ${{ github.token }}

  validate-release:
    if: github.event_name == 'release'
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
